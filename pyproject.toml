[project]
name = "safesound"
version = "0.0.1"
description = "Tiny, DSP-grounded detector of safety sounds for deaf and hard-of-hearing people, deployable on ESP32-S3"
requires-python = ">=3.10"
dependencies = ["numpy", "scipy", "soundfile", "pandas"]

[project.optional-dependencies]
train = ["torch", "torchaudio", "librosa"]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["safesound"]
